name: Disassemble Kernel vmlinux

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  disassemble:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: ARM64 Cross-Compiler Toolchain installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Prüfen welche Datei existiert
        run: |
          if [ -f "vmlinux_uncompressed" ]; then
            echo "KERNEL_FILE=vmlinux_uncompressed" >> $GITHUB_ENV
          elif [ -f "vmlinux_decompressed" ]; then
            echo "KERNEL_FILE=vmlinux_decompressed" >> $GITHUB_ENV
          elif [ -f "vmlinux" ]; then
            echo "KERNEL_FILE=vmlinux" >> $GITHUB_ENV
          else
            echo "FEHLER: Keine entpackte vmlinux Datei im Repository gefunden!"
            exit 1
          fi

      - name: Full Disassembly (Raw ARM64 Binary) durchführen
        run: |
          echo "Disassemble startet für Raw Binary: $KERNEL_FILE..."
          
          # -b binary sagt objdump, dass es ein rohes Binary ohne ELF-Header ist
          # -m aarch64 erzwingt die ARM 64-Bit Architektur
          aarch64-linux-gnu-objdump -b binary -m aarch64 -D "$KERNEL_FILE" > vmlinux.asm
          
          echo "Disassembly erfolgreich abgeschlossen! Dateigröße:"
          ls -lh vmlinux.asm

      - name: Nach Treiber- & Frequenz-Strings (Hex) filtern
        run: |
          echo "=== Erstelle Logdateien mit Text-Strings ==="
          
          # Lesbare Textstrings mit Byte-Positionen extrahieren
          strings -t x "$KERNEL_FILE" | grep -i "cpufreq" > cpufreq_strings.txt || true
          strings -t x "$KERNEL_FILE" | grep -i "rockchip" > rockchip_strings.txt || true
          strings -t x "$KERNEL_FILE" | grep -E "1296000|1368000|1512000" > frequency_strings.txt || true

          echo "Text-Analysen wurden erstellt!"

      - name: Assembler-Dateien als Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: xu10-kernel-disassembly
          path: |
            vmlinux.asm
            cpufreq_strings.txt
            rockchip_strings.txt
            frequency_strings.txt
