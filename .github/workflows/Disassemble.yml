name: Disassemble Kernel vmlinux

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  disassemble:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: LLVM Toolchain installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm binutils

      - name: Prüfen welche Datei existiert
        run: |
          if [ -f "vmlinux_uncompressed" ]; then
            echo "KERNEL_FILE=vmlinux_uncompressed" >> $GITHUB_ENV
          elif [ -f "vmlinux_decompressed" ]; then
            echo "KERNEL_FILE=vmlinux_decompressed" >> $GITHUB_ENV
          elif [ -f "vmlinux" ]; then
            echo "KERNEL_FILE=vmlinux" >> $GITHUB_ENV
          else
            echo "FEHLER: Keine entpackte vmlinux Datei im Repository gefunden!"
            exit 1
          fi

      - name: Disassembly mit LLVM durchführen
        run: |
          echo "Disassemble startet für Raw Binary mit LLVM: $KERNEL_FILE..."
          
          # Syntax für LLVM: --mtriple=aarch64 statt -b / -m
          llvm-objdump --mtriple=aarch64 -D "$KERNEL_FILE" > vmlinux.asm || true
          
          echo "Disassembly abgeschlossen! Dateigröße:"
          ls -lh vmlinux.asm

      - name: Nach Treiber- & Frequenz-Strings (Hex) filtern
        run: |
          echo "=== Erstelle Logdateien mit Text-Strings ==="
          
          # Lesbare Textstrings mit Byte-Positionen (Hex Offsets) extrahieren
          strings -t x "$KERNEL_FILE" | grep -i "cpufreq" > cpufreq_strings.txt || true
          strings -t x "$KERNEL_FILE" | grep -i "rockchip" > rockchip_strings.txt || true
          strings -t x "$KERNEL_FILE" | grep -E "1296000|1368000|1512000" > frequency_strings.txt || true

          echo "Text-Analysen wurden erstellt!"

      - name: Assembler-Dateien als Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: xu10-kernel-disassembly
          path: |
            vmlinux.asm
            cpufreq_strings.txt
            rockchip_strings.txt
            frequency_strings.txt
