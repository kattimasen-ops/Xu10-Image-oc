name: Patch Kernel Image (OC Frequencies)

on:
  workflow_dispatch:

jobs:
  patch-kernel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: In-place Hex-Patching der originalen Image
        run: |
          if [ ! -f "Image" ]; then
            echo "FEHLER: Datei 'Image' im Root-Verzeichnis nicht gefunden!"
            exit 1
          fi

          python3 -c '
          with open("Image", "rb") as f:
              data = bytearray(f.read())

          orig_size = len(data)
          print(f"Originale Dateigröße: {orig_size} Bytes")

          # 1. Target: 1.296.000 kHz in Little Endian (\x80\xC6\x13\x00)
          target = b"\x80\xC6\x13\x00"
          
          # 2. Replacement: 1.512.000 kHz in Little Endian (\xA0\x12\x17\x00)
          replacement = b"\xA0\x12\x17\x00"

          count = data.count(target)
          print(f"Gefundene Vorkommen von 1.296 GHz: {count}")

          if count > 0:
              data = data.replace(target, replacement)
              new_size = len(data)
              
              if orig_size != new_size:
                  print("FEHLER: Dateigröße hat sich verändert!")
                  exit(1)

              with open("Image.patched", "wb") as f:
                  f.write(data)
              print("In-place Patch erfolgreich! Dateigröße exakt identisch.")
          else:
              print("FEHLER: Target Bytes wurden in der Image-Datei nicht gefunden!")
              exit(1)
          '

      - name: Gepatchte Image als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: XU10-Patched-Image
          path: Image.patched
